    <!-- BMI Calculator Form -->
    <div class="bmi-calculator" id="bmiCalculator">
        <h2>BMI Calculator</h2>
        <form id="bmiForm">
            <label for="height">Height (cm):</label>
            <input type="number" id="height" name="height" required min="30" max="300" step="0.1">

            <label for="weight">Weight (kg):</label>
            <input type="number" id="weight" name="weight" required min="2" max="500" step="0.1">

            <button type="submit">Calculate BMI</button>
        </form>
        <div id="result"></div>
    </div>

    <script type="module">
        // Client-side BMI calculation and interactivity
        const bmiForm = document.getElementById('bmiForm');
        const resultDiv = document.getElementById('result');

        bmiForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const height = parseFloat(document.getElementById('height').value);
            const weight = parseFloat(document.getElementById('weight').value);

            if (isNaN(height) || isNaN(weight) || height <= 0 || weight <= 0) {
                resultDiv.textContent = 'Please enter valid height and weight.';
                return;
            }

            const bmi = weight / ((height / 100) ** 2);
            const roundedBmi = bmi.toFixed(2);

            let category = '';
            if (bmi < 18.5) {
                category = 'Underweight';
            } else if (bmi < 25) {
                category = 'Normal weight';
            } else if (bmi < 30) {
                category = 'Overweight';
            } else {
                category = 'Obese';
            }

            resultDiv.textContent = `Your BMI is: ${roundedBmi} (${category})`;
        });
    </script>
